<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var theme = 'light';
          try {
            var stored = localStorage.getItem('feedpulse-theme');
            if (stored === 'light' || stored === 'dark') {
              theme = stored;
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
              theme = 'dark';
            }
          } catch (e) {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
              theme = 'dark';
            }
          }
          document.documentElement.dataset.theme = theme;
        } catch (err) {
          // Guaranteed to never throw and only set data-theme
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231B232B' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><path d='M3 12h4l3-7 4 14 3-7h4'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FeedPulse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-paper text-ink font-sans antialiased min-h-screen selection:bg-line">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
